# Installed by K2-OpenHost Installer Helper.
# OrcaSlicer 2.4.2 sends the placeholder "X-Api-Key: 88888888" to Moonraker
# (OrcaSlicer PR #15550), which Moonraker rejects even for trusted clients.
# Drop only that placeholder; real API keys pass unchanged.
map $http_x_api_key $k2oh_api_key {
    "88888888" "";
    default    $http_x_api_key;
}
